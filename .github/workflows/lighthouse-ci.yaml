name: Lighthouse CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "next.config.ts"
      - "tailwind.config.js"

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: |
          corepack prepare pnpm@10.10.0 --activate
          pnpm install --frozen-lockfile

      - name: Create Environment File
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}"
          echo "NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}"
          echo "NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}"

      - name: Build Application
        run: pnpm build

      - name: Serve Application
        run: |
          pnpm start &
          sleep 10
        env:
          PORT: 3000

      - name: Wait for server
        run: |
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Lighthouse Score
        id: format_lighthouse_score
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // LHCI 결과 파일 경로
            const manifestPath = '.lighthouseci/manifest.json';

            if (!fs.existsSync(manifestPath)) {
              console.log('Lighthouse 결과 파일을 찾을 수 없습니다.');
              return;
            }

            const results = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            let comments = "## ⚡️ Lighthouse CI Report\n\n";

            if (results.length === 0) {
              comments += "❌ Lighthouse 결과가 없습니다.\n";
              core.setOutput('comments', comments);
              return;
            }

            results.forEach((result, index) => {
              const { summary, jsonPath } = result;
              
              if (!fs.existsSync(jsonPath)) {
                console.log(`결과 파일을 찾을 수 없습니다: ${jsonPath}`);
                return;
              }
              
              const details = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              const { audits, finalUrl } = details;
              
              // 점수 포맷팅 함수
              const formatResult = (res) => Math.round((res || 0) * 100);
              
              // 점수별 색상 이모지
              const score = (res) => {
                const numScore = formatResult(res);
                return numScore >= 90 ? "🟢" : numScore >= 50 ? "🟠" : "🔴";
              };
              
              // 카테고리 점수 포맷팅
              const formattedSummary = {};
              Object.keys(summary).forEach(
                (key) => (formattedSummary[key] = formatResult(summary[key]))
              );
              
              // URL 표시 (여러 페이지가 있는 경우)
              if (results.length > 1) {
                comments += `### 📄 Page ${index + 1}: ${finalUrl}\n\n`;
              }
              
              // 메인 점수 테이블
              const mainScoreTable = [
                `### 📊 Overall Scores`,
                `| Category | Score |`,
                `| --- | --- |`,
                `| ${score(summary.performance)} **Performance** | **${formattedSummary.performance}** |`,
                `| ${score(summary.accessibility)} **Accessibility** | **${formattedSummary.accessibility}** |`,
                `| ${score(summary['best-practices'])} **Best Practices** | **${formattedSummary['best-practices']}** |`,
                `| ${score(summary.seo)} **SEO** | **${formattedSummary.seo}** |`,
                `| ${score(summary.pwa)} **PWA** | **${formattedSummary.pwa}** |`,
                ``
              ].join("\n");
              
              // 상세 성능 지표
              const performanceDetails = [
                `### 🚀 Performance Details`,
                `| Metric | Value | Score |`,
                `| --- | --- | --- |`,
                `| ${score(audits["first-contentful-paint"]?.score)} **First Contentful Paint** | ${audits["first-contentful-paint"]?.displayValue || 'N/A'} | ${formatResult(audits["first-contentful-paint"]?.score)} |`,
                `| ${score(audits["largest-contentful-paint"]?.score)} **Largest Contentful Paint** | ${audits["largest-contentful-paint"]?.displayValue || 'N/A'} | ${formatResult(audits["largest-contentful-paint"]?.score)} |`,
                `| ${score(audits["speed-index"]?.score)} **Speed Index** | ${audits["speed-index"]?.displayValue || 'N/A'} | ${formatResult(audits["speed-index"]?.score)} |`,
                `| ${score(audits["cumulative-layout-shift"]?.score)} **Cumulative Layout Shift** | ${audits["cumulative-layout-shift"]?.displayValue || 'N/A'} | ${formatResult(audits["cumulative-layout-shift"]?.score)} |`,
                `| ${score(audits["total-blocking-time"]?.score)} **Total Blocking Time** | ${audits["total-blocking-time"]?.displayValue || 'N/A'} | ${formatResult(audits["total-blocking-time"]?.score)} |`,
                ``
              ].join("\n");
              
              // 주요 개선 제안사항 (점수가 낮은 항목들)
              const suggestions = [];
              if (formattedSummary.performance < 90) {
                suggestions.push("🔧 **Performance**: 이미지 최적화, 코드 분할, 캐싱 전략 검토");
              }
              if (formattedSummary.accessibility < 90) {
                suggestions.push("♿ **Accessibility**: alt 텍스트, 색상 대비, 키보드 네비게이션 개선");
              }
              if (formattedSummary['best-practices'] < 90) {
                suggestions.push("✅ **Best Practices**: HTTPS 사용, 보안 헤더, 라이브러리 업데이트");
              }
              if (formattedSummary.seo < 90) {
                suggestions.push("🔍 **SEO**: 메타 태그, 구조화된 데이터, 모바일 친화성 개선");
              }
              
              let improvementSection = "";
              if (suggestions.length > 0) {
                improvementSection = [
                  `### 💡 Improvement Suggestions`,
                  ...suggestions.map(s => `- ${s}`),
                  ``
                ].join("\n");
              }
              
              comments += mainScoreTable + performanceDetails + improvementSection;
              
              if (index < results.length - 1) {
                comments += "\n---\n\n";
              }
            });

            // 전체적인 상태 요약
            const overallPerformance = results.reduce((acc, result) => {
              return acc + formatResult(result.summary.performance);
            }, 0) / results.length;

            const statusEmoji = overallPerformance >= 90 ? "✅" : overallPerformance >= 50 ? "⚠️" : "❌";
            const statusText = overallPerformance >= 90 ? "Excellent" : overallPerformance >= 50 ? "Needs Improvement" : "Poor";

            comments = `${statusEmoji} **Overall Status: ${statusText}** (avg: ${Math.round(overallPerformance)})\n\n` + comments;

            // 보고서 링크 추가
            comments += `\n---\n`;
            comments += `📊 *Generated by [Lighthouse CI](https://github.com/GoogleChrome/lighthouse-ci)*\n`;
            comments += `🤖 *Auto-generated on ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}*`;

            core.setOutput('comments', comments);

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comments = `${{ steps.format_lighthouse_score.outputs.comments }}`;

            if (!comments || comments.trim() === '') {
              console.log('댓글 내용이 없습니다.');
              return;
            }

            // 기존 Lighthouse 댓글 찾기
            const { data: existingComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = existingComments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('⚡️ Lighthouse CI Report')
            );

            if (botComment) {
              // 기존 댓글 업데이트
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comments
              });
              console.log('기존 Lighthouse 댓글을 업데이트했습니다.');
            } else {
              // 새 댓글 생성
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comments
              });
              console.log('새 Lighthouse 댓글을 생성했습니다.');
            }
