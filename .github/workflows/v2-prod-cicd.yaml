name: Frontend CI/CD for v2-prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 태그 (예: v1.3.0)'
        required: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Prod Server
    runs-on: ubuntu-latest
    environment: prod

    env:
      REGION: asia-northeast3
      REPOSITORY: registry
      SERVICE: frontend
      ENVIRONMENT: prod
      DEPLOY_SCRIPT: ~/nemo/cloud/v2/scripts/deploy.sh
      ENV_FILE: nemo/cloud/v2/envs/frontend.prod.env

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY_PROD }}'

    - name: Set GCP Project
      run: gcloud config set project ${{ secrets.GCP_PROJECT_ID_PROD }}

    - name: Set image tags and URI
      run: |
        TIME_TAG="${{ env.ENVIRONMENT }}-$(TZ=Asia/Seoul date +'%Y%m%d-%H%M')"
        echo "TIME_TAG=$TIME_TAG" >> $GITHUB_ENV

        VERSION_TAG="prod-${{ github.event.inputs.version }}"
        echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

        IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}"
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Load .env from GCP Secret Manager
      run: |
        gcloud secrets versions access latest --secret="${{ env.SERVICE }}-env-${{ env.ENVIRONMENT }}" > .env

    - name: Install Dependencies & Build (Next.js)
      run: |
        corepack enable
        corepack prepare pnpm@10.10.0 --activate
        pnpm install --frozen-lockfile
        pnpm build

    - name: Build and Push Docker Image
      run: |
        echo Checking pushed image: ${IMAGE_URI}:${TIME_TAG}"
        echo Checking pushed image: ${IMAGE_URI}:${VERSION_TAG}"
        echo Checking pushed image: ${IMAGE_URI}:${{ env.ENVIRONMENT }}-latest"

        docker buildx build \
          --platform linux/amd64 \
          -t "${IMAGE_URI}:${TIME_TAG}" \
          -t "${IMAGE_URI}:${VERSION_TAG}" \
          -t "${IMAGE_URI}:${{ env.ENVIRONMENT }}-latest" \
          --push .

    - name: Deploy via Bastion to Prod Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}

        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ${{ secrets.BASTION_USER }}
        proxy_key: ${{ secrets.BASTION_SSH_KEY }}

        script: |
          bash ${{ env.DEPLOY_SCRIPT }} ${{ env.SERVICE }} ${{ env.ENVIRONMENT }}      
